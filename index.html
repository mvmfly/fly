<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulator Training Database</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-grad-start: #05070a;
            --bg-grad-mid: #0b1021;
            --bg-grad-end: #05070a;
            --glass-bg: rgba(10, 15, 30, 0.75);
            --glass-border: rgba(0, 229, 255, 0.15); 
            --text-main: #cdd6f4;
            --text-heading: #00e5ff; 
            --accent: #00bcd4; 
            --card-bg: rgba(0, 0, 0, 0.5);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            --btn-text: #000;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(0, 229, 255, 0.2);
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%; min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
            background-color: var(--bg-grad-start); 
        }

        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #bg-gradient { z-index: -10; background: radial-gradient(circle at center, var(--bg-grad-mid) 0%, var(--bg-grad-start) 100%); }
        #space-elements { z-index: -5; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle linear infinite; opacity: 0; }
        @keyframes twinkle { 0% { opacity: 0; } 50% { opacity: 0.8; } 100% { opacity: 0; } }

        .container {
            width: 95%; max-width: 1000px;
            margin: 40px auto 40px auto; padding: 30px;
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 8px; border: 1px solid var(--glass-border);
            box-shadow: var(--card-shadow); position: relative; z-index: 1;
        }

        h2, h3, h4 { color: var(--text-heading); margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        h2 { border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 25px; font-weight: 700; }

        .button {
            padding: 12px 24px; font-size: 15px; cursor: pointer; border: none; border-radius: 4px;
            background: var(--accent); color: var(--btn-text); font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15); transition: all 0.2s; text-transform: uppercase;
            display: inline-block; text-align: center;
        }
        .button:hover { filter: brightness(1.2); box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); }
        .button-secondary, .button-back { background: #37474f; color: #eceff1; }
        .button-delete { background: #c62828; color: white; padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; }

        .form-section { margin-bottom: 25px; width: 100%; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-heading); }
        .sub-label { font-size: 0.85em; opacity: 0.8; margin-bottom: 5px; display: block; }
        
        input[type="text"], select, textarea {
            width: 100%; padding: 12px; border-radius: 4px; border: 1px solid var(--input-border);
            background: var(--input-bg); color: var(--text-main); font-size: 15px;
            font-family: 'Consolas', monospace; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); background: rgba(0, 229, 255, 0.05); }
        select option { background-color: #0b1021; color: #e0e0e0; }

        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .flex-grow { flex-grow: 1; min-width: 200px; }

        .rich-text-container { border: 1px solid var(--input-border); border-radius: 4px; overflow: hidden; background: var(--input-bg); }
        .toolbar { padding: 5px 10px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--input-border); display: flex; gap: 5px; flex-wrap: wrap; }
        .toolbar button { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; border-radius: 4px; font-weight: bold; }
        .toolbar button:hover { background: rgba(0,229,255,0.2); color: var(--accent); }
        .rich-input { width: 100%; min-height: 120px; padding: 12px; background: transparent; color: var(--text-main); border: none; outline: none; resize: vertical; overflow-y: auto; }

        .maneuver-block { background: rgba(0,0,0,0.2); padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--accent); border-radius: 4px; position: relative; }
        .folder-level { background: rgba(255,255,255,0.05); padding: 10px; border-left: 3px solid var(--accent); border-radius: 4px; margin-bottom: 10px; }
        
        .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .folder-card { 
            background: var(--card-bg); padding: 20px; border-radius: 6px; border: 1px solid var(--glass-border); 
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 15px; font-weight: bold;
            word-break: break-word;
        }
        .folder-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 5px 15px rgba(0,229,255,0.1); }
        .folder-card i { font-size: 1.5em; color: var(--accent); }

        .profile-list-item { 
            background: var(--card-bg); padding: 15px; margin-bottom: 10px; border-radius: 6px; 
            border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; cursor: pointer; 
            flex-wrap: wrap; gap: 10px;
        }
        .profile-list-item:hover { border-color: var(--accent); }

        .badge { display: inline-block; padding: 6px 10px; font-size: 0.85em; border-radius: 4px; background: #37474f; margin-right: 5px; margin-bottom: 5px;}
        .vote-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border); }

        .view { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .view.active { display: block; opacity: 1; }
        
        .breadcrumb { font-size: 0.9em; opacity: 0.8; margin-bottom: 20px; font-family: monospace; word-wrap: break-word; }
        .breadcrumb span { cursor: pointer; color: var(--accent); }
        .breadcrumb span:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .container { width: 100%; margin: 20px auto; padding: 15px; border: none; border-radius: 0; }
            .folder-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .flex-row { flex-direction: column; }
            .button { width: 100%; margin: 5px 0; }
            .vote-bar { flex-direction: column; }
            .vote-bar .flex-grow { display: none; }
        }

        @media print {
            body { background: #fff !important; color: #000 !important; } 
            .bg-layer, .button, .vote-bar, .header-controls { display: none !important; }
            .container { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background: #fff !important; }
            .maneuver-block { page-break-inside: avoid; border-left: 3px solid #000 !important; border-radius: 0 !important; background: #fff !important; color: #000 !important; padding: 10px 15px !important; margin-bottom: 10px !important; border-bottom: 1px solid #ccc !important; border-top: 1px solid #ccc !important; border-right: 1px solid #ccc !important; }
            h2, h3, h4 { color: #000 !important; margin-top: 10px !important; margin-bottom: 5px !important; }
            p { color: #000 !important; margin-top: 5px !important; margin-bottom: 5px !important; }
            strong { color: #000 !important; }
            .badge { background: #f0f0f0 !important; color: #000 !important; border: 1px solid #000 !important; }
            .rich-text-container { background: #fff !important; border: none !important; padding: 0 !important; color: #000 !important; }
            #view-misc { padding: 0 !important; }
        }
    </style>
</head>
<body>

    <div id="bg-gradient" class="bg-layer"></div>
    <div id="space-elements" class="bg-layer"><div id="stars-container"></div></div>

    <div class="container" id="main-container">
        
        <!-- Menu View -->
        <div id="menu-view" class="view active" style="display: block; opacity: 1;">
             <h2><i class="fas fa-plane"></i> Fleet Selection</h2>
             <div class="flex-row" style="margin-bottom: 20px;">
                 <input type="text" id="search-box" class="flex-grow" placeholder="Search profiles, manoeuvres...">
                 <button class="button" onclick="performSearch()" style="width: auto;"><i class="fas fa-search"></i></button>
             </div>
             <div id="fleet-grid" class="folder-grid">
                 <div style="grid-column: 1 / -1; text-align: center; padding: 20px;">
                     <i class="fas fa-spinner fa-spin" style="font-size: 2em; color: var(--accent); margin-bottom: 15px;"></i><br>
                     Establishing connection to database...
                 </div>
             </div>
             <hr style="border-color: var(--glass-border); margin: 30px 0;">
             <button class="button button-secondary" style="width: 100%;" onclick="openSubmitForm()"><i class="fas fa-file-signature"></i> Submit New Profile</button>
        </div>

        <!-- Explorer View -->
        <div id="explorer-view" class="view">
             <div class="breadcrumb" id="explorer-breadcrumb"></div>
             <h2 id="explorer-title">Explorer</h2>
             
             <div id="subfolder-section" style="display: none;">
                 <h3><i class="fas fa-folder-open"></i> Folders</h3>
                 <div id="subfolder-grid" class="folder-grid"></div>
             </div>

             <h3 style="margin-top: 30px;"><i class="fas fa-file-alt"></i> Profiles</h3>
             <div id="profile-list"></div>

             <div style="margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px;">
                 <button type="button" class="button button-back" onclick="window.history.back()">Back</button>
                 <button type="button" class="button" onclick="openSubmitForm()">+ Add Profile Here</button>
             </div>
        </div>

        <!-- Submit View -->
        <div id="submit-view" class="view">
             <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
                <h2 style="margin: 0;" id="submit-header-title">Submit Sim Profile</h2>
                <button type="button" class="button button-back" onclick="window.history.back()" style="margin: 0;">Cancel</button>
             </div>
             
             <form id="entry-form">
                 <div class="form-section"> 
                     <label>Fleet Type</label> 
                     <div class="flex-row">
                        <select id="submit-fleet" class="flex-grow" required onchange="handleFleetSessionChange()">
                            <option value="" selected disabled>-- Select Fleet --</option>
                            <option value="__add_new__">+ Create New Fleet</option>
                        </select>
                     </div>
                     <input type="text" id="fleet-new" style="display:none;" placeholder="Enter New Fleet (e.g. B737)">
                 </div>

                 <div class="form-section"> 
                     <label>Session Type</label> 
                     <div class="flex-row">
                        <select id="submit-session" class="flex-grow" required onchange="handleFleetSessionChange()">
                            <option value="" selected disabled>-- Select Session --</option>
                            <option value="__add_new__">+ Create New Session Type</option>
                        </select>
                     </div>
                     <input type="text" id="session-new" style="display:none;" placeholder="Enter Session Type">
                 </div>

                 <div class="form-section"> 
                     <label>Directory Path (Unlimited Subfolders)</label>
                     <span class="sub-label">Leave as Root, or specify/select nesting levels to file this profile into specific folders.</span>
                     <div id="dynamic-folders-container"></div>
                 </div>
                 
                 <div class="form-section"> 
                     <label>Profile Title</label> 
                     <input type="text" id="submit-title" required placeholder="e.g. Profile A - WSSS">
                 </div>

                 <div class="form-section"> 
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px;">
                        <h3 style="margin: 0;">Manoeuvre/Condition Blocks</h3> 
                        <button type="button" class="button button-secondary" id="btn-add-maneuver-top" onclick="addManeuver()" style="margin: 0;">+ Add Manoeuvre/Condition</button> 
                    </div>
                    
                    <div id="maneuvers-container" style="margin-top: 15px;"></div> 
                    
                    <div style="display:flex; justify-content: flex-end; margin-top: 10px;">
                        <button type="button" class="button button-secondary" id="btn-add-maneuver-bottom" onclick="addManeuver()" style="margin: 0; display: none;">+ Add Manoeuvre/Condition</button>
                    </div>
                 </div>

                 <div class="form-section"> 
                    <label>Miscellaneous Remarks & Briefing Notes</label> 
                    <div class="rich-text-container">
                        <div class="toolbar">
                            <button type="button" onclick="formatText('misc-notes', 'bold')"><i class="fas fa-bold"></i></button>
                            <button type="button" onclick="formatText('misc-notes', 'italic')"><i class="fas fa-italic"></i></button>
                            <button type="button" onclick="formatText('misc-notes', 'underline')"><i class="fas fa-underline"></i></button>
                            <button type="button" onclick="formatText('misc-notes', 'insertUnorderedList')"><i class="fas fa-list-ul"></i></button>
                        </div>
                        <div id="misc-notes" class="rich-input" contenteditable="true"></div>
                    </div>
                 </div>

                 <div class="form-section"> 
                    <button type="submit" id="submit-btn" class="button" style="width: 100%;">Publish Profile</button> 
                 </div>
             </form>
        </div>

        <div id="profile-view" class="view">
             <div class="breadcrumb" id="profile-breadcrumb"></div>
             <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap: wrap; gap: 10px;">
                 <h2 id="view-title" style="margin-bottom: 5px; width: 100%;">Profile Title</h2>
                 <div style="margin-bottom: 20px;">
                     <span class="badge" id="view-date"></span>
                 </div>
                 <div style="display: flex; gap: 10px;">
                     <button type="button" class="button button-secondary" onclick="triggerEdit()"><i class="fas fa-edit"></i> Edit</button>
                     <button type="button" class="button" onclick="window.print()"><i class="fas fa-file-pdf"></i> Export PDF</button>
                 </div>
             </div>

             <div id="view-maneuvers"></div>

             <h3 style="margin-top: 30px;">Briefing & Misc Notes</h3>
             <div class="rich-text-container" style="padding: 20px; background: rgba(0,0,0,0.1);" id="view-misc"></div>

             <div class="vote-bar">
                 <button class="button button-secondary" id="btn-upvote" onclick="submitMetric('upvote')"><i class="fas fa-thumbs-up"></i> Useful (<span id="count-up">0</span>)</button>
                 <button class="button button-secondary" id="btn-downvote" onclick="submitMetric('downvote')"><i class="fas fa-thumbs-down"></i> Needs Update (<span id="count-down">0</span>)</button>
                 <div class="flex-grow"></div>
                 <button class="button" style="background: #e65100;" onclick="submitMetric('flag')"><i class="fas fa-flag"></i> Flag Nuisance</button>
             </div>
             
             <button type="button" class="button button-back" onclick="window.history.back()" style="margin-top: 20px;">Back</button>
        </div>

    </div> 

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwiPy9U-JvpsNb6KqKW8q7d5eWH2fR4DaG2CCSiOlst0ZBsJ7q-sK2HJXxgfMRW0OA5/exec'; 

        let allProfiles = [];
        let dataTree = { profiles: [], children: {} }; 
        let isFetching = false;
        let currentNavPath = []; 
        let viewingRowIndex = null;
        
        let dynamicPathLevels = []; 
        let editingRowIndex = null; 

        document.addEventListener('DOMContentLoaded', async () => {
            createStars();
            history.replaceState({ viewId: 'menu-view', navPath: [], rowIndex: null, searchTerm: null }, "", "#menu-view");
            await fetchAllData();
            applyState('menu-view');
        });

        window.addEventListener('popstate', (event) => {
            if (event.state) {
                currentNavPath = event.state.navPath || [];
                viewingRowIndex = event.state.rowIndex || null;
                applyState(event.state.viewId, event.state.searchTerm);
            } else {
                currentNavPath = [];
                viewingRowIndex = null;
                applyState('menu-view');
            }
        });

        function goToView(viewId, newPath = null, newRowIndex = null, searchTerm = null) {
            if(newPath !== null) currentNavPath = [...newPath];
            if(newRowIndex !== null) viewingRowIndex = newRowIndex;
            history.pushState({ viewId, navPath: [...currentNavPath], rowIndex: viewingRowIndex, searchTerm }, "", `#${viewId}`);
            applyState(viewId, searchTerm);
        }

        function applyState(viewId, searchTerm = null) {
            document.querySelectorAll('.view').forEach(v => {
                v.classList.remove('active');
                setTimeout(() => { if(!v.classList.contains('active')) v.style.display = 'none'; }, 400);
            });
            const active = document.getElementById(viewId);
            if(active) {
                active.style.display = 'block';
                setTimeout(() => active.classList.add('active'), 10);
            }

            if(viewId === 'menu-view') renderMenu();
            else if(viewId === 'explorer-view') {
                if(searchTerm) renderSearchResults(searchTerm);
                else renderExplorer();
            }
            else if(viewId === 'submit-view') populateFormDropdowns();
            else if(viewId === 'profile-view') renderProfileData();
        }

        function createStars() {
            const container = document.getElementById('stars-container');
            if (!container) return;
            for(let i=0; i<70; i++){
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }

        async function fetchAllData() {
            if (isFetching) return;
            isFetching = true;
            try {
                const res = await fetch(WEB_APP_URL);
                const text = await res.text(); 
                
                let data;
                try { data = JSON.parse(text); } 
                catch (parseError) {
                    document.getElementById('fleet-grid').innerHTML = `<div style="grid-column: 1/-1; padding: 20px; text-align: center; background: rgba(198, 40, 40, 0.2); border: 1px solid #c62828; border-radius: 4px;"><strong>Connection Refused.</strong><br>Ensure your Google Apps Script is deployed properly.</div>`;
                    return; 
                }
                
                allProfiles = []; 
                dataTree = { profiles: [], children: {} };

                if(data.status === 'success' && data.values) {
                    data.values.forEach((row, index) => {
                        if (parseInt(row[10]) >= 3) return; 
                        
                        const profile = {
                            rowIndex: index + 2, 
                            timestamp: row[0],
                            fleet: row[1] || 'Unknown Fleet',
                            sessionType: row[2] || 'General',
                            subFolder: row[3] || '',
                            title: row[4] || 'Untitled Profile',
                            maneuvers: parseJSON(row[6]),
                            miscNotes: row[7] || '',
                            upvotes: parseInt(row[8]) || 0,
                            downvotes: parseInt(row[9]) || 0,
                            flags: parseInt(row[10]) || 0
                        };
                        allProfiles.push(profile);

                        let pathParts = [profile.fleet, profile.sessionType];
                        if (profile.subFolder) {
                            pathParts = pathParts.concat(profile.subFolder.split(' / ').map(s => s.trim()).filter(s => s));
                        }

                        let current = dataTree;
                        pathParts.forEach(part => {
                            if (!current.children[part]) {
                                current.children[part] = { profiles: [], children: {} };
                            }
                            current = current.children[part];
                        });
                        current.profiles.push(profile);
                    });
                }
            } catch(e) {
                document.getElementById('fleet-grid').innerHTML = `<div style="grid-column: 1/-1; padding: 20px; text-align: center; background: rgba(198, 40, 40, 0.2); border: 1px solid #c62828; border-radius: 4px;"><strong>Network Error.</strong><br>Could not reach the database.</div>`;
            } finally {
                isFetching = false;
            }
        }

        function parseJSON(str) { try { return JSON.parse(str); } catch(e) { return []; } }

        function openNode(nodeName) {
            let newPath = [...currentNavPath, nodeName];
            goToView('explorer-view', newPath);
        }

        function renderMenu() {
            const grid = document.getElementById('fleet-grid');
            if(grid.innerHTML.includes("Connection Refused") || grid.innerHTML.includes("Network Error")) return;
            
            grid.innerHTML = '';
            const fleets = Object.keys(dataTree.children);
            if(fleets.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1;'>Database initialized. No profiles found. Be the first to submit!</p>";
                return;
            }
            
            fleets.sort().forEach(fleet => {
                grid.innerHTML += `<div class="folder-card" onclick="openNode('${fleet}')">
                                      <i class="fas fa-plane"></i> <span>${fleet}</span>
                                   </div>`;
            });
        }

        function renderExplorer() {
            const bc = document.getElementById('explorer-breadcrumb');
            const title = document.getElementById('explorer-title');
            const subGrid = document.getElementById('subfolder-grid');
            const subSec = document.getElementById('subfolder-section');
            const pList = document.getElementById('profile-list');
            
            subGrid.innerHTML = ''; pList.innerHTML = ''; subSec.style.display = 'none';

            let current = dataTree;
            let bcrumbHtml = `<span onclick="goToView('menu-view', [])">Home</span>`;
            
            let tempPath = [];
            currentNavPath.forEach((part, index) => {
                tempPath.push(part);
                const pathCopy = JSON.stringify(tempPath);
                if (index === currentNavPath.length - 1) {
                    bcrumbHtml += ` > <span>${part}</span>`;
                } else {
                    bcrumbHtml += ` > <span onclick='goToView("explorer-view", ${pathCopy})'>${part}</span>`;
                }
                current = current.children[part];
            });
            
            bc.innerHTML = bcrumbHtml;
            title.innerHTML = currentNavPath[currentNavPath.length - 1] || 'Explorer';

            const folders = Object.keys(current.children);
            if (folders.length > 0) {
                subSec.style.display = 'block';
                folders.sort().forEach(folder => {
                    let icon = 'fa-folder';
                    if(currentNavPath.length === 0) icon = 'fa-plane';
                    else if (currentNavPath.length === 1) icon = 'fa-chalkboard-teacher';
                    
                    subGrid.innerHTML += `<div class="folder-card" onclick="openNode('${folder}')"><i class="fas ${icon}"></i> <span>${folder}</span></div>`;
                });
            }

            if (current.profiles.length > 0) {
                renderProfileList(current.profiles, pList);
            } else if (folders.length === 0 && currentNavPath.length > 1) {
                pList.innerHTML = "<p>No profiles or subfolders here yet.</p>";
            }
        }

        function renderProfileList(profilesArray, container) {
            profilesArray.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).forEach(p => {
                const helpfulPct = (p.upvotes + p.downvotes) > 0 ? Math.round((p.upvotes / (p.upvotes + p.downvotes)) * 100) : 0;
                let ratingHtml = helpfulPct > 0 ? `<small style="color:var(--accent); font-weight:bold;">${helpfulPct}% Useful</small>` : '';
                
                container.innerHTML += `<div class="profile-list-item" onclick="viewProfile(${p.rowIndex})">
                                            <div style="flex-grow:1;">
                                                <div style="font-weight:bold; font-size:1.1em; margin-bottom:5px;">${p.title}</div>
                                            </div>
                                            <div>${ratingHtml}</div>
                                        </div>`;
            });
        }

        function viewProfile(rowIndex) {
            goToView('profile-view', currentNavPath, rowIndex);
        }

        function renderProfileData() {
            if(!viewingRowIndex) return;
            const p = allProfiles.find(x => x.rowIndex === viewingRowIndex);
            if(!p) return;
            
            let pathDisplay = p.fleet + ' > ' + p.sessionType;
            if(p.subFolder) pathDisplay += ' > ' + p.subFolder.split('/').map(s=>s.trim()).join(' > ');
            
            document.getElementById('profile-breadcrumb').innerHTML = pathDisplay;
            document.getElementById('view-title').textContent = p.title;
            
            let dateStr = "Unknown Date";
            if(p.timestamp) {
                let d = isNaN(p.timestamp) ? new Date(p.timestamp) : new Date((p.timestamp - 25569) * 86400 * 1000);
                let day = String(d.getDate()).padStart(2, '0');
                let month = String(d.getMonth() + 1).padStart(2, '0');
                let year = String(d.getFullYear()).slice(-2);
                dateStr = `${day}${month}${year}`;
            }
            document.getElementById('view-date').textContent = `Submitted: ${dateStr}`;

            const mContainer = document.getElementById('view-maneuvers');
            mContainer.innerHTML = '';
            if(p.maneuvers && p.maneuvers.length > 0) {
                p.maneuvers.forEach((m, i) => {
                    let ant = m.callouts.trim();
                    let ptr = m.pointers.trim();
                    
                    let antHtml = ant ? `<p style="white-space: pre-wrap; margin-top: 5px; margin-bottom: 5px;"><strong>Anticipate:</strong><br>${ant}</p>` : '';
                    let ptrHtml = ptr ? `<p style="white-space: pre-wrap; margin-top: 5px; margin-bottom: 5px;"><strong>Pointers/Traps:</strong><br>${ptr}</p>` : '';
                    
                    mContainer.innerHTML += `
                        <div class="maneuver-block">
                            <h4 style="margin-bottom:5px; margin-top:0px;">${i+1}. ${m.name}</h4>
                            ${antHtml}
                            ${ptrHtml}
                        </div>`;
                });
            }

            document.getElementById('view-misc').innerHTML = p.miscNotes || '';
            document.getElementById('count-up').textContent = p.upvotes;
            document.getElementById('count-down').textContent = p.downvotes;
        }

        function updateManeuverButtons() {
            const container = document.getElementById('maneuvers-container');
            const bottomBtn = document.getElementById('btn-add-maneuver-bottom');
            if (container.children.length === 0) {
                bottomBtn.style.display = 'none';
            } else {
                bottomBtn.style.display = 'inline-block';
            }
        }

        function openSubmitForm() {
            editingRowIndex = null;
            document.getElementById('entry-form').reset();
            document.getElementById('submit-header-title').textContent = "Submit Sim Profile";
            document.getElementById('submit-btn').textContent = "Publish Profile";
            document.getElementById('maneuvers-container').innerHTML = '';
            document.getElementById('misc-notes').innerHTML = '';
            updateManeuverButtons();
            
            populateFormDropdowns();
            dynamicPathLevels = [];
            renderDynamicFolders();
            
            if (currentNavPath.length > 0) {
                document.getElementById('submit-fleet').value = currentNavPath[0];
                handleFleetSessionChange();
                if (currentNavPath.length > 1) {
                    document.getElementById('submit-session').value = currentNavPath[1];
                    handleFleetSessionChange();
                    
                    if (currentNavPath.length > 2) {
                        for(let i=2; i<currentNavPath.length; i++){
                            dynamicPathLevels.push({ selectedValue: currentNavPath[i], newValue: '' });
                        }
                        renderDynamicFolders();
                    }
                }
            }
            goToView('submit-view', currentNavPath);
        }

        function triggerEdit() {
            if(!viewingRowIndex) return;
            const p = allProfiles.find(x => x.rowIndex === viewingRowIndex);
            if(!p) return;

            editingRowIndex = viewingRowIndex;
            document.getElementById('submit-header-title').textContent = "Edit Sim Profile";
            document.getElementById('submit-btn').textContent = "Save Changes";
            document.getElementById('entry-form').reset();
            
            populateFormDropdowns();
            
            document.getElementById('submit-fleet').value = p.fleet;
            if(!document.getElementById('submit-fleet').value) {
                document.getElementById('submit-fleet').value = "__add_new__";
                document.getElementById('fleet-new').value = p.fleet;
            }
            
            handleFleetSessionChange(); 

            document.getElementById('submit-session').value = p.sessionType;
            if(!document.getElementById('submit-session').value) {
                document.getElementById('submit-session').value = "__add_new__";
                document.getElementById('session-new').value = p.sessionType;
            }
            
            dynamicPathLevels = [];
            if (p.subFolder) {
                const parts = p.subFolder.split(' / ');
                parts.forEach(part => {
                    dynamicPathLevels.push({ selectedValue: part, newValue: '' });
                });
            }
            renderDynamicFolders();

            document.getElementById('submit-title').value = p.title;
            document.getElementById('misc-notes').innerHTML = p.miscNotes;

            const mContainer = document.getElementById('maneuvers-container');
            mContainer.innerHTML = '';
            p.maneuvers.forEach(m => {
                const div = document.createElement('div');
                div.className = 'maneuver-block';
                div.innerHTML = `
                    <button type="button" class="button-delete" onclick="this.parentElement.remove(); updateManeuverButtons();" style="position:absolute; right:10px; top:10px;"><i class="fas fa-times"></i></button>
                    <input type="text" placeholder="" class="m-name" value="${m.name}" required style="margin-bottom:10px; font-weight:bold;">
                    <textarea placeholder="Anticipate..." class="m-callouts" rows="2" style="margin-bottom:10px;">${m.callouts}</textarea>
                    <textarea placeholder="Pointers/Traps..." class="m-pointers" rows="2">${m.pointers}</textarea>
                `;
                mContainer.appendChild(div);
            });
            updateManeuverButtons();

            goToView('submit-view', currentNavPath);
        }

        function populateFormDropdowns() {
            const fleetSel = document.getElementById('submit-fleet');
            const sessSel = document.getElementById('submit-session');
            
            fleetSel.innerHTML = '<option value="" selected disabled>-- Select Fleet --</option><option value="__add_new__">+ Create New Fleet</option>';
            sessSel.innerHTML = '<option value="" selected disabled>-- Select Session --</option><option value="__add_new__">+ Create New Session Type</option>';

            Object.keys(dataTree.children).sort().forEach(f => { fleetSel.innerHTML += `<option value="${f}">${f}</option>`; });

            let allSessions = new Set();
            Object.values(dataTree.children).forEach(fleetObj => Object.keys(fleetObj.children).forEach(s => allSessions.add(s)));
            Array.from(allSessions).sort().forEach(s => { sessSel.innerHTML += `<option value="${s}">${s}</option>`; });
        }

        function handleFleetSessionChange() {
            const fleetSel = document.getElementById('submit-fleet');
            document.getElementById('fleet-new').style.display = fleetSel.value === '__add_new__' ? 'block' : 'none';
            
            const sessSel = document.getElementById('submit-session');
            document.getElementById('session-new').style.display = sessSel.value === '__add_new__' ? 'block' : 'none';
            
            dynamicPathLevels = [];
            renderDynamicFolders();
        }

        function getTreeForCurrentFleetAndSession() {
            let fleet = document.getElementById('submit-fleet').value;
            if(fleet === '__add_new__' || !fleet) return null; 
            let session = document.getElementById('submit-session').value;
            if(session === '__add_new__' || !session) return null;
            
            if(dataTree.children[fleet] && dataTree.children[fleet].children[session]) {
                return dataTree.children[fleet].children[session];
            }
            return null;
        }

        function renderDynamicFolders() {
            const container = document.getElementById('dynamic-folders-container');
            container.innerHTML = '';
            
            let currentTree = getTreeForCurrentFleetAndSession(); 
            
            let needsNewLevel = false;
            if (currentTree) {
                let tempTree = currentTree;
                let fullySelected = true;
                for (let i=0; i<dynamicPathLevels.length; i++) {
                    let val = dynamicPathLevels[i].selectedValue;
                    if (!val || val === '__add_new__') {
                        fullySelected = false;
                        break;
                    }
                    if (tempTree && tempTree.children[val]) {
                        tempTree = tempTree.children[val];
                    } else {
                        tempTree = null;
                    }
                }
                if (fullySelected && tempTree && Object.keys(tempTree.children).length > 0) {
                    needsNewLevel = true;
                }
            }

            if (needsNewLevel) {
                dynamicPathLevels.push({ selectedValue: '', newValue: '' });
            }

            currentTree = getTreeForCurrentFleetAndSession();
            for (let i = 0; i < dynamicPathLevels.length; i++) {
                let levelState = dynamicPathLevels[i];
                
                let optionsHtml = `<option value="">-- No Subfolder (Save Here) --</option>`;
                if (currentTree) {
                    Object.keys(currentTree.children).sort().forEach(f => {
                        optionsHtml += `<option value="${f}" ${levelState.selectedValue === f ? 'selected' : ''}>${f}</option>`;
                    });
                }
                
                if (levelState.selectedValue && levelState.selectedValue !== '__add_new__' && currentTree && (!currentTree.children || !currentTree.children[levelState.selectedValue])) {
                    optionsHtml += `<option value="${levelState.selectedValue}" selected>${levelState.selectedValue}</option>`;
                }

                optionsHtml += `<option value="__add_new__" ${levelState.selectedValue === '__add_new__' ? 'selected' : ''}>+ Create New Subfolder</option>`;
                
                let levelHtml = `
                    <div class="folder-level">
                        <label style="font-size: 0.9em;">Subfolder Level ${i + 1}</label>
                        <div class="flex-row">
                            <select class="flex-grow" onchange="handleFolderSelectChange(${i}, this.value)">
                                ${optionsHtml}
                            </select>
                            <button type="button" class="button button-delete" onclick="removeFolderLevel(${i})" style="margin: 0;"><i class="fas fa-trash"></i></button>
                        </div>
                        <input type="text" style="display: ${levelState.selectedValue === '__add_new__' ? 'block' : 'none'}; margin-top: 5px;" placeholder="Enter new folder name" value="${levelState.newValue}" oninput="handleFolderNewInput(${i}, this.value)">
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', levelHtml);
                
                if (levelState.selectedValue && levelState.selectedValue !== '__add_new__') {
                    currentTree = currentTree ? currentTree.children[levelState.selectedValue] : null;
                } else {
                    currentTree = null;
                }
            }
            
            container.insertAdjacentHTML('beforeend', `<button type="button" class="button button-secondary" onclick="addFolderLevel()" style="padding: 8px 12px; font-size: 0.9em; margin-top: 5px;"><i class="fas fa-plus"></i> Add Subfolder Layer</button>`);
        }

        function handleFolderSelectChange(index, value) {
            dynamicPathLevels[index].selectedValue = value;
            dynamicPathLevels = dynamicPathLevels.slice(0, index + 1);
            renderDynamicFolders();
        }

        function handleFolderNewInput(index, value) { dynamicPathLevels[index].newValue = value; }
        
        function addFolderLevel() {
            dynamicPathLevels.push({ selectedValue: '', newValue: '' });
            renderDynamicFolders();
        }

        function removeFolderLevel(index) {
            dynamicPathLevels.splice(index, 1);
            renderDynamicFolders();
        }

        function addManeuver() {
            const div = document.createElement('div');
            div.className = 'maneuver-block';
            div.innerHTML = `
                <button type="button" class="button-delete" onclick="this.parentElement.remove(); updateManeuverButtons();" style="position:absolute; right:10px; top:10px;"><i class="fas fa-times"></i></button>
                <input type="text" placeholder="" class="m-name" required style="margin-bottom:10px; font-weight:bold;">
                <textarea placeholder="Anticipate..." class="m-callouts" rows="2" style="margin-bottom:10px;"></textarea>
                <textarea placeholder="Pointers/Traps..." class="m-pointers" rows="2"></textarea>
            `;
            document.getElementById('maneuvers-container').appendChild(div);
            updateManeuverButtons();
        }

        function formatText(elementId, command) { document.execCommand(command, false, null); document.getElementById(elementId).focus(); }

        document.getElementById('entry-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalBtnText = btn.textContent;
            btn.disabled = true; btn.textContent = "Saving...";

            let fleet = document.getElementById('submit-fleet').value;
            if(fleet === '__add_new__') fleet = document.getElementById('fleet-new').value.trim();
            
            let session = document.getElementById('submit-session').value;
            if(session === '__add_new__') session = document.getElementById('session-new').value.trim();

            let finalPathArray = [];
            for(let i=0; i<dynamicPathLevels.length; i++) {
                let val = dynamicPathLevels[i].selectedValue;
                if(val === '__add_new__') val = dynamicPathLevels[i].newValue.trim();
                if(val) finalPathArray.push(val);
            }
            let finalSubFolder = finalPathArray.join(' / ');

            const formData = new URLSearchParams();
            formData.append('action', editingRowIndex ? 'edit_profile' : 'submit_profile');
            if (editingRowIndex) formData.append('rowIndex', editingRowIndex);
            
            formData.append('fleet', fleet);
            formData.append('sessionType', session);
            formData.append('subFolder', finalSubFolder);
            formData.append('profileTitle', document.getElementById('submit-title').value.trim());
            formData.append('sopVersion', ""); 
            formData.append('miscNotes', document.getElementById('misc-notes').innerHTML);

            const mList = [];
            document.querySelectorAll('#maneuvers-container .maneuver-block').forEach(div => {
                mList.push({
                    name: div.querySelector('.m-name').value.trim(),
                    callouts: div.querySelector('.m-callouts').value.trim(),
                    pointers: div.querySelector('.m-pointers').value.trim()
                });
            });
            formData.append('maneuvers', JSON.stringify(mList));

            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: formData });
                const res = await response.json();
                if(res.status === 'success') {
                    this.reset();
                    document.getElementById('maneuvers-container').innerHTML = '';
                    document.getElementById('misc-notes').innerHTML = '';
                    updateManeuverButtons();
                    await fetchAllData();
                    window.history.back(); 
                } else throw new Error(res.message);
            } catch(error) { 
                console.error(error); 
            } finally { 
                btn.disabled = false; btn.textContent = originalBtnText; 
            }
        });

        async function submitMetric(metricType) {
            if(!viewingRowIndex) return;
            const btn = document.getElementById(`btn-${metricType}`) || document.activeElement;
            const originalText = btn.innerHTML;
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i>";
            btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('action', 'update_metric');
            formData.append('rowIndex', viewingRowIndex);
            formData.append('metricType', metricType);

            try {
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: formData });
                const res = await response.json();
                if(res.status === 'success') {
                    if(metricType !== 'flag') {
                        const span = document.getElementById(metricType === 'upvote' ? 'count-up' : 'count-down');
                        if(span) span.textContent = res.newValue;
                    }
                    const p = allProfiles.find(x => x.rowIndex === viewingRowIndex);
                    if(p) {
                        if(metricType==='upvote') p.upvotes = res.newValue;
                        if(metricType==='downvote') p.downvotes = res.newValue;
                        if(metricType==='flag') p.flags = res.newValue;
                    }
                }
            } catch(e) { 
                console.error(e); 
            } finally { 
                btn.innerHTML = originalText; btn.disabled = false; 
            }
        }

        function renderSearchResults(term) {
            document.getElementById('explorer-breadcrumb').innerHTML = `<span onclick="goToView('menu-view', [])">Home</span> > Search Results for "${term}"`;
            document.getElementById('explorer-title').textContent = "Search Results";
            document.getElementById('subfolder-section').style.display = 'none';
            
            const results = allProfiles.filter(p => 
                p.title.toLowerCase().includes(term) || 
                p.fleet.toLowerCase().includes(term) ||
                (p.maneuvers && p.maneuvers.some(m => m.name.toLowerCase().includes(term)))
            );
            
            const pList = document.getElementById('profile-list');
            pList.innerHTML = '';
            renderProfileList(results, pList);
        }

        function performSearch() {
            const term = document.getElementById('search-box').value.toLowerCase().trim();
            if(!term) return;
            goToView('explorer-view', [], null, term);
        }
    </script>
</body>
